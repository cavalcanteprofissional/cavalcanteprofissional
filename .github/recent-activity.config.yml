settings:
  max_lines: 5
  commit_msg: "docs(readme): atualiza atividade recente automaticamente"
  line_prefix: "{NUM}. "
  # Evita ruído autorreferente (commits do bot no próprio perfil)
  ignored_repos:
    - cavalcanteprofissional/cavalcanteprofissional
  # Sem comentários e estrelas — só atividade de construção de fato
  whitelisted_events:
    - push
    - create_repo
    - fork
    - issues_open
    - issues_close
    - pr_open
    - pr_merge
    - pr_close
    - release
    - review
  date:
    timezone: America/Fortaleza
    text: "Última atualização: {DATE}"
    format: "dd/mm/yyyy 'às' HH:MM:ss"

messages:
  added_member: "🤝 Tornei-me colaborador em {REPO}"
  changes_approved: "👍 Aprovei {ID} em {REPO}"
  changes_requested: "🔴 Solicitei {AMOUNT} mudança(s) em {ID} em {REPO}"
  create_repo: "📔 Criei o repositório {REPO}"
  fork_repo: "🔱 Fiz fork de {FORK} a partir de {REPO}"
  issue_opened: "❗️ Abri a issue {ID} em {REPO}"
  issue_closed: "✔️ Fechei a issue {ID} em {REPO}"
  new_release: "✌️ Publiquei o release {ID} em {REPO}"
  pr_opened: "💪 Abri o PR {ID} em {REPO}"
  pr_closed: "❌ Fechei o PR {ID} em {REPO}"
  pr_merged: "🎉 Fiz merge do PR {ID} em {REPO}"
  push: "⬆️ Enviei {AMOUNT} commit(s) para {REPO}"
